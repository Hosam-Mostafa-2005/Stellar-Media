<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stellar Media — Creative, branding, luxury packaging, and digital marketing agency in Abu Dhabi, UAE. وكالة ستيلار ميديا للإبداع والهوية البصرية والتسويق الرقمي في أبوظبي."
    />
    <link rel="icon" type="image/png" href="/stellar_logo.png" />
    <title>Stellar Media | وكالة ستيلار للإبداع والتسويق الرقمي — أبوظبي</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('stellar_media_lang');
          if (saved === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
            document.title = 'Stellar Media | Creative & Digital Marketing Agency — Abu Dhabi';
            document.documentElement.classList.add('en-mode');
          } else {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
            document.documentElement.classList.remove('en-mode');
          }
        } catch (e) {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#080D1B] text-[#F5F7FC] antialiased selection:bg-[#168BFF] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
